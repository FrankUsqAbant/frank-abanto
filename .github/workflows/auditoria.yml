name: auditoria
on:
  push:
    branches: [auditoria]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2 @axe-core/playwright@4.10.1 lighthouse@12.2.1 sharp@0.33.5
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p out
      - name: Rama a medir (.github/rama.txt; vacio = sitio publicado)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          R=$(cat .github/rama.txt 2>/dev/null | tr -d '[:space:]')
          if [ -n "$R" ]; then
            git fetch -q origin "$R" && git worktree add -q sitio FETCH_HEAD
            if [ -f sitio/scripts/proyectos.mjs ]; then (cd sitio && node scripts/proyectos.mjs | tee ../out/proyectos.log); cp sitio/proyectos/*.webp out/ 2>/dev/null || true; fi
            (cd sitio && nohup python3 -m http.server 8080 >/dev/null 2>&1 &) ; sleep 2
            echo "URL=http://localhost:8080/" >> $GITHUB_ENV
          else
            echo "URL=https://frank-abanto.pages.dev/" >> $GITHUB_ENV
          fi
      - name: Lighthouse movil
        run: npx lighthouse "$URL" --quiet --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=out/lh-mobile.json || true
      - name: Lighthouse escritorio
        run: npx lighthouse "$URL" --preset=desktop --quiet --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=out/lh-desktop.json || true
      - run: node .github/auditoria.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: auditoria
          path: out
