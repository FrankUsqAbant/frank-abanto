<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#1f1c17"/>
      <stop offset="100%" stop-color="#0e0d0b"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Base redondeada sastre -->
  <rect width="120" height="120" rx="28" fill="url(#bgGlow)" stroke="#2d2a25" stroke-width="2.5"/>
  <rect x="6" y="6" width="108" height="108" rx="22" fill="none" stroke="#ff5a36" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>
  
  <g filter="url(#shadow)">
    <!-- Letra F -->
    <path d="M34 86V34H64M34 58H58" stroke="#f4f2ee" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Letra A -->
    <path d="M64 86L80 34L96 86" stroke="#f4f2ee" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Travesaño en hilo sastre naranja -->
    <path d="M70.5 68H89.5" stroke="#ff5a36" stroke-width="7.5" stroke-linecap="round"/>
    
    <!-- Hilo que enlaza la aguja y corona la A -->
    <path d="M80 34C80 22 96 20 98 29C100 39 88 44 86 48" stroke="#ff5a36" stroke-width="4" stroke-linecap="round"/>
    <!-- Ojo de la aguja -->
    <circle cx="80" cy="34" r="2.8" fill="#0e0d0b" stroke="#f4f2ee" stroke-width="1.8"/>
    <!-- Puntada de acento -->
    <circle cx="34" cy="34" r="3" fill="#ff5a36"/>
  </g>
</svg>
