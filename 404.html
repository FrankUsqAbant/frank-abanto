<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Esta página no existe · Frank Abanto</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
@font-face{font-family:"Instrument Serif";font-style:italic;font-weight:400;font-display:swap;src:url(/fonts/instrument-serif-400-italic.woff2) format("woff2")}
@font-face{font-family:Inter;font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/inter-variable.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:100 800;font-display:swap;src:url(/fonts/jetbrains-mono-variable.woff2) format("woff2")}
:root{--tinta:#0e0d0b;--papel:#f4f2ee;--hilo:#ff5a36;--gris:#8d887e;--lado:clamp(16px,5vw,72px)}
*{box-sizing:border-box;margin:0}
body{min-height:100svh;background:var(--tinta);color:var(--papel);font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;justify-content:flex-end;padding:var(--lado);gap:28px}
p.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris)}
h1{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(56px,12vw,180px);line-height:.9;letter-spacing:-.03em}
h1 em{color:var(--hilo)}
.hilo{height:2px;background:repeating-linear-gradient(90deg,var(--hilo) 0 14px,transparent 14px 24px);max-width:520px}
a{display:inline-flex;align-items:center;min-height:44px;width:max-content;background:var(--hilo);color:var(--tinta);font-weight:600;font-size:15px;padding:0 22px;border-radius:999px;text-decoration:none}
a:focus-visible{outline:2px solid var(--papel);outline-offset:4px}
</style>
</head>
<body>
<main>
  <p class="mono">Error 404 · se soltó una puntada</p>
  <h1>Esta página<br>no está <em>cosida.</em></h1>
</main>
<div class="hilo" aria-hidden="true"></div>
<a href="/">Volver al inicio ↗</a>
</body>
</html>
